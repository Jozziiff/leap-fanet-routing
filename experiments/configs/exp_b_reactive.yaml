# Experiment B, part 1: the reactive control R (SPEC §7; R9). Greedy + switch to the best other neighbor after
# every ACK timeout, no prediction; LEAP's hello (same size), so A2 - R isolates prediction (DECISIONS D-012).
# Same 11 configurations and seeds 1-3 as Exp A, whose Greedy and GRAd runs are reused (D-009).
# Results go to the same folder as the LEAP variants (exp_b_comparison), added once tau_th is frozen.
name: exp_b_comparison
seeds: [1, 2, 3]
fixed:
  sim_time_s: 30
  traffic_start_s: 2
  traffic_end_s: 27
  energy: "off"
reference: {n: 30, speed: 10, rate: 1}
sweeps:
  n: [10, 20, 30, 40, 50]
  speed: [5, 10, 15, 20]
  rate: [0.5, 1, 2, 5]
variants:
  - {label: greedy_reactive, protocol: leap, params: {tau_th_s: 0, repair: reactive}}

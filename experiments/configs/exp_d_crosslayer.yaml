# Experiment D: bonus B1, cross-layer weighting by the MAC retransmission rate (SPEC §9.1; X1).
# LEAP+XL at the frozen tau_th = 0.25 s (docs/tau_freeze.json). The LEAP baseline is reused from Exp B
# (same configurations, seeds 1-3, paired). Speed sweep S2 plus the high-load point lambda = 5.
name: exp_d_crosslayer
seeds: [1, 2, 3]
fixed:
  sim_time_s: 30
  traffic_start_s: 2
  traffic_end_s: 27
  energy: "off"
reference: {n: 30, speed: 10, rate: 1}
sweeps:
  speed: [5, 10, 15, 20]
  rate: [5]
variants:
  - {label: leap_xl, protocol: leap, params: {tau_th_s: 0.25, repair: predictive, xl: true, xl_beta: 0.2}}
